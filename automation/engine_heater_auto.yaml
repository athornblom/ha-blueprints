blueprint:
  name: Engine heater auto-off (DEFA etc.)
  description: >-
    Turns an engine heater (DEFA, Calix or any heater on a smart plug) off
    automatically, however it was turned on — app, button on the plug or Home
    Assistant.


    **How it works**

    - When the plug turns on, it waits for a car: if no power draw within the
    waiting time, the plug turns off.

    - When the heater starts drawing power, it heats for the set time — scaled
    by the outdoor temperature if you pick a temperature source (counted once
    per session, so a heater thermostat that cycles doesn't extend it) — and
    then turns off.

    - If nothing draws power shortly after it was turned on, the person who
    turned it on gets a phone notification ("is the cable plugged in?"). If it
    was turned on outside Home Assistant, everyone with the companion app gets
    it.

    - Optional evening check: on the evenings you pick, if the forecast shows
    frost before your departure time, the plug is switched on for a few seconds
    to see if the car is plugged in. If nothing draws power, the people you
    pick get a notification.


    Restart-safe: uses a timer helper (with restore) and a toggle helper, and
    checks the plug when Home Assistant starts.
  domain: automation
  author: athornblom
  source_url: https://github.com/athornblom/ha-blueprints/blob/main/automation/engine_heater_auto.yaml
  homeassistant:
    min_version: "2026.5.0"
  input:
    devices_section:
      name: Heater
      icon: mdi:car-defrost-front
      input:
        heater_switch:
          name: Heater plug
          description: The smart plug (switch) the engine heater is connected to.
          selector:
            entity:
              filter:
                - domain: switch
        power_sensor:
          name: Power sensor
          description: >-
            The plug's power sensor (W). Used to see when the car is plugged in
            and the heater actually draws power.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power

    timing_section:
      name: Times
      icon: mdi:timer-outline
      input:
        temperature_entity:
          name: Outdoor temperature (optional)
          description: >-
            A temperature sensor or a weather entity. When set, the heating time
            scales with the temperature between the mild and cold times below.
            Without it (or if it is unavailable) the cold heating time is used.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
                - domain: weather
        heat_minutes:
          name: Heating time — cold
          description: >-
            Heating time at the cold limit or colder (and when no temperature is
            available). Counted from when the heater starts drawing power.
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        cold_temperature:
          name: Cold limit
          description: At or below this outdoor temperature the cold heating time is used.
          default: -15
          selector:
            number:
              min: -40
              max: 10
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        heat_minutes_mild:
          name: Heating time — mild
          description: >-
            Heating time at the mild limit or warmer. Between the limits the time
            is scaled gradually.
          default: 15
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        mild_temperature:
          name: Mild limit
          description: At or above this outdoor temperature the mild heating time is used.
          default: -1
          selector:
            number:
              min: -30
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        wait_minutes:
          name: Wait for a car
          description: >-
            If the plug is on but nothing draws power within this time, the plug
            turns off.
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider

    notify_section:
      name: Notification
      icon: mdi:cellphone-message
      input:
        notify_no_power:
          name: Notify when nothing draws power
          description: >-
            Send a phone notification to the person who turned it on (everyone
            if it was turned on outside Home Assistant) when the plug is on but
            nothing draws power.
          default: true
          selector:
            boolean: {}
        no_power_minutes:
          name: Notify after
          description: How long the plug has to be on without power draw before the notification.
          default: 1
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
        notify_message:
          name: Notification text
          description: The text of the notification, in your own language.
          default: >-
            The engine heater is on but isn't drawing power. Is the cable
            plugged into the car? It turns off automatically if no car is
            connected.
          selector:
            text:
              multiline: true

    evening_check_section:
      name: Evening plug-in check
      icon: mdi:snowflake-alert
      input:
        check_enabled:
          name: Check in the evening that the car is plugged in
          description: >-
            Switches the plug on for up to 45 seconds to see if the heater draws
            power, then off again.
          default: false
          selector:
            boolean: {}
        check_time:
          name: Check time
          description: When the evening check runs.
          default: "21:00:00"
          selector:
            time: {}
        check_days:
          name: Evenings to check
          description: >-
            The evenings before the days you drive, e.g. Sunday–Thursday for
            working days.
          default: [sun, mon, tue, wed, thu]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        weather_entity:
          name: Weather forecast (strongly recommended)
          description: >-
            A weather entity with an hourly forecast, so the check only runs
            when frost is expected. **Without it the check runs every chosen
            evening**, whatever the weather (also if the forecast can't be read).
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        departure_time:
          name: Departure time
          description: Frost is looked for in the forecast from the check until this time.
          default: "07:00:00"
          selector:
            time: {}
        frost_temperature:
          name: Frost risk at or below
          description: Windshields can frost a little above 0 °C on clear nights.
          default: 1
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider
        check_people:
          name: Notify
          description: >-
            People to notify (on their companion apps) when the car isn't
            plugged in. Nobody picked → everyone with the companion app.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
        check_message:
          name: Notification text
          description: Sent when the evening check finds no power draw.
          default: >-
            Frost is expected tonight but the car doesn't seem to be plugged
            into the engine heater.
          selector:
            text:
              multiline: true

    helpers_section:
      name: Helpers
      icon: mdi:tools
      collapsed: true
      input:
        timer_helper:
          name: Timer helper
          description: >-
            A timer for this heater. Create it under Settings → Devices &
            services → Helpers → Timer and enable "Restore". Its own duration
            doesn't matter.
          selector:
            entity:
              filter:
                - domain: timer
        heating_helper:
          name: "\"Heating\" helper"
          description: >-
            A toggle helper for this heater. It remembers that heating has
            started in the current session, so the heating time is only counted
            once. Create it under Helpers → Toggle.
          selector:
            entity:
              filter:
                - domain: input_boolean
        power_threshold:
          name: Power draw above
          description: The heater counts as drawing power above this level.
          default: 50
          selector:
            number:
              min: 5
              max: 500
              step: 5
              unit_of_measurement: W
              mode: box

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input heater_switch
    to: "on"
    id: turned_on
  - trigger: state
    entity_id: !input heater_switch
    from: "off"
    to: "on"
    for:
      minutes: !input no_power_minutes
    id: no_power_check
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input power_threshold
    for: "00:00:05"
    id: power_detected
  - trigger: timer.finished
    target:
      entity_id: !input timer_helper
    id: timer_finished
  - trigger: state
    entity_id: !input heater_switch
    to: "off"
    id: turned_off
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time
    at: !input check_time
    id: plug_check
    enabled: !input check_enabled

variables:
  heater_switch: !input heater_switch
  power_sensor: !input power_sensor
  timer_helper: !input timer_helper
  heating_helper: !input heating_helper
  temperature_entity: !input temperature_entity
  heat_minutes: !input heat_minutes
  heat_minutes_mild: !input heat_minutes_mild
  cold_temperature: !input cold_temperature
  mild_temperature: !input mild_temperature
  wait_minutes: !input wait_minutes
  power_threshold: !input power_threshold
  notify_no_power: !input notify_no_power
  weather_entity: !input weather_entity
  departure_time: !input departure_time
  frost_temperature: !input frost_temperature
  check_people: !input check_people
  wait_duration: "{{ '%02d:%02d:00' % ((wait_minutes | int) // 60, (wait_minutes | int) % 60) }}"

actions:
  - choose:
      - alias: Turned on — start waiting for a car
        conditions:
          - condition: trigger
            id: turned_on
          # Skips a queued run once the plug is off again (the evening probe).
          - condition: state
            entity_id: !input heater_switch
            state: "on"
          - condition: state
            entity_id: !input timer_helper
            state: idle
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input heating_helper
          - action: timer.start
            target:
              entity_id: !input timer_helper
            data:
              duration: "{{ wait_duration }}"

      - alias: Power detected — heat for the set time (once per session)
        conditions:
          - condition: trigger
            id: power_detected
          - condition: state
            entity_id: !input heater_switch
            state: "on"
          - condition: state
            entity_id: !input heating_helper
            state: "off"
        sequence:
          - variables:
              # Outdoor temperature right now (sensor state or weather attribute).
              outdoor_temperature: >-
                {%- if temperature_entity in ['', none] -%}none
                {%- elif temperature_entity.startswith('weather.') -%}
                  {{ state_attr(temperature_entity, 'temperature') | float('none') }}
                {%- else -%}{{ states(temperature_entity) | float('none') }}{%- endif -%}
              # Cold time at/below the cold limit, mild time at/above the mild
              # limit, scaled linearly in between. No temperature → cold time.
              heat_minutes_now: >-
                {%- set cold_t = cold_temperature | float -%}
                {%- set mild_t = mild_temperature | float -%}
                {%- set cold_m = heat_minutes | float -%}
                {%- set mild_m = heat_minutes_mild | float -%}
                {%- if outdoor_temperature in ['none', none] or mild_t <= cold_t -%}{{ cold_m | int }}
                {%- else -%}
                  {%- set t = [[outdoor_temperature | float, cold_t] | max, mild_t] | min -%}
                  {{ (cold_m + (mild_m - cold_m) * (t - cold_t) / (mild_t - cold_t)) | round(0) | int }}
                {%- endif -%}
              heat_duration: "{{ '%02d:%02d:00' % ((heat_minutes_now | int) // 60, (heat_minutes_now | int) % 60) }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input heating_helper
          - action: timer.start
            target:
              entity_id: !input timer_helper
            data:
              duration: "{{ heat_duration }}"

      - alias: No power draw — notify the person who turned it on
        conditions:
          - condition: trigger
            id: no_power_check
          - "{{ notify_no_power | bool }}"
          - condition: state
            entity_id: !input heating_helper
            state: "off"
          - condition: numeric_state
            entity_id: !input power_sensor
            below: !input power_threshold
        sequence:
          - variables:
              started_by: "{{ trigger.to_state.context.user_id }}"
              heater_name: "{{ state_attr(heater_switch, 'friendly_name') or heater_switch }}"
              # Person who turned it on → their device trackers → matching
              # companion-app notify entities. Everyone if unknown.
              notify_targets: >-
                {%- set all_notify = states.notify | map(attribute='entity_id') | list -%}
                {%- set ns = namespace(t=[]) -%}
                {%- for person in states.person | selectattr('attributes.user_id', 'eq', started_by) -%}
                  {%- for dt in person.attributes.device_trackers | default([]) -%}
                    {%- set n = 'notify.' ~ dt.split('.')[1] -%}
                    {%- if n in all_notify -%}{%- set ns.t = ns.t + [n] -%}{%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ ns.t if ns.t | count > 0 else all_notify }}
          - if: "{{ notify_targets | count > 0 }}"
            then:
              - action: notify.send_message
                target:
                  entity_id: "{{ notify_targets }}"
                data:
                  title: "{{ heater_name }}"
                  message: !input notify_message

      - alias: Time is up — turn off
        conditions:
          - condition: trigger
            id: timer_finished
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input heater_switch
          - action: input_boolean.turn_off
            target:
              entity_id: !input heating_helper

      - alias: Turned off — reset
        conditions:
          - condition: trigger
            id: turned_off
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input timer_helper
          - action: input_boolean.turn_off
            target:
              entity_id: !input heating_helper

      - alias: Evening check — is the car plugged in?
        conditions:
          - condition: trigger
            id: plug_check
          - condition: time
            weekday: !input check_days
          - condition: state
            entity_id: !input heater_switch
            state: "off"
        sequence:
          - if: "{{ weather_entity not in ['', none] }}"
            then:
              - action: weather.get_forecasts
                target:
                  entity_id: "{{ weather_entity }}"
                data:
                  type: hourly
                response_variable: forecast
                continue_on_error: true
              - variables:
                  # Lowest forecast temperature until the next departure time.
                  forecast_low: >-
                    {%- set ns = namespace(low=none) -%}
                    {%- if forecast is defined -%}
                      {%- set dep = today_at(departure_time) -%}
                      {%- if dep <= now() -%}{%- set dep = dep + timedelta(days=1) -%}{%- endif -%}
                      {%- for f in forecast[weather_entity].forecast | default([]) -%}
                        {%- if f.temperature is number and as_datetime(f.datetime) <= dep -%}
                          {%- set ns.low = f.temperature if ns.low is none else [ns.low, f.temperature] | min -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {{ ns.low }}
              - if: "{{ forecast_low is number and forecast_low > frost_temperature | float }}"
                then:
                  - stop: No frost in the forecast
          # The probe is shorter than "Notify after" (min 1 min), so the
          # general no-power notification never fires for it.
          - action: switch.turn_on
            target:
              entity_id: !input heater_switch
          - wait_template: "{{ states(power_sensor) | float(0) > power_threshold | float }}"
            timeout: "00:00:45"
          - variables:
              plugged_in: "{{ wait.completed }}"
          - action: switch.turn_off
            target:
              entity_id: !input heater_switch
          - if: "{{ not plugged_in }}"
            then:
              - variables:
                  heater_name: "{{ state_attr(heater_switch, 'friendly_name') or heater_switch }}"
                  notify_targets: >-
                    {%- set all_notify = states.notify | map(attribute='entity_id') | list -%}
                    {%- set ns = namespace(t=[]) -%}
                    {%- for person in check_people -%}
                      {%- for dt in state_attr(person, 'device_trackers') or [] -%}
                        {%- set n = 'notify.' ~ dt.split('.')[1] -%}
                        {%- if n in all_notify -%}{%- set ns.t = ns.t + [n] -%}{%- endif -%}
                      {%- endfor -%}
                    {%- endfor -%}
                    {{ ns.t if check_people | count > 0 else all_notify }}
              - if: "{{ notify_targets | count > 0 }}"
                then:
                  - action: notify.send_message
                    target:
                      entity_id: "{{ notify_targets }}"
                    data:
                      title: "{{ heater_name }}"
                      message: !input check_message

      - alias: Home Assistant started — turn off if on without a running timer
        conditions:
          - condition: trigger
            id: startup
          - condition: state
            entity_id: !input heater_switch
            state: "on"
          - condition: state
            entity_id: !input timer_helper
            state: idle
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input heater_switch
          - action: input_boolean.turn_off
            target:
              entity_id: !input heating_helper
