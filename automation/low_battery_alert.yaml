blueprint:
  name: Low Battery (by label)
  description: >-
    Sends a notification when any entity carrying a chosen label drops
    below a battery percentage threshold. Tag the devices you want to
    monitor with a label on any Home Assistant installation — no need to
    hardcode entities.
  domain: automation
  author: athornblom
  source_url: https://github.com/athornblom/ha-blueprints/blob/main/automation/low_battery_alert.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    battery_label:
      name: Battery label
      description: The label applied to the entities whose battery level should be monitored.
      selector:
        label: {}
    threshold_percent:
      name: Threshold
      description: Notify when the battery level drops below this percentage.
      default: 15
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider
    notify_action:
      name: Notification
      description: >-
        What to do when a battery crosses the threshold. The default sends
        a notification (notify.notify) to every registered device, with
        the entity's name and current level. Override it to target a
        specific device or add critical-push flags.
      default:
        - action: notify.notify
          data:
            title: "🔋 Low battery"
            message: >-
              {{ state_attr(trigger.entity_id, 'friendly_name') }} has low
              battery ({{ states(trigger.entity_id) }}%)
      selector:
        action: {}

mode: queued
max: 10

triggers:
  - trigger: battery.level_crossed_threshold
    target:
      label_id: !input battery_label
    options:
      threshold:
        type: below
        value:
          number: !input threshold_percent
      behavior: each

actions: !input notify_action
